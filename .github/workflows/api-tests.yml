name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverest-api-tests
  cancel-in-progress: false

jobs:
  test:
    name: Mocha tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests and generate JSON report
        run: npx mocha --reporter json "tests/*.test.js" > test-results.json

      - name: Add test results to the run summary
        if: always()
        run: node scripts/publish-test-summary.js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-test-report
          path: test-results.json
          if-no-files-found: warn
          retention-days: 14
